name: CI

on:
  push:
    branches: [main, "feature/**", "codex/**"]
  pull_request:
    branches: [main, "feature/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt

      - name: Run unit tests
        run: |
          cd backend
          python -m unittest discover -s tests -p "test_*.py"

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Build frontend
        run: npm run build --prefix frontend

  mysql-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_only
          MYSQL_DATABASE: baijiarui_bi_ci
          MYSQL_USER: baijiarui_ci
          MYSQL_PASSWORD: ci_password_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ubaijiarui_ci -pci_password_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Initialize isolated schema
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_DATABASE: baijiarui_bi_ci
          MYSQL_USER: baijiarui_ci
          MYSQL_PASSWORD: ci_password_only
          APP_SECRET: ci-only-secret
        run: |
          python scripts/release_tool.py init-schema
      - name: Run MySQL integration tests
        env:
          RUN_MYSQL_INTEGRATION: '1'
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_DATABASE: baijiarui_bi_ci
          MYSQL_USER: baijiarui_ci
          MYSQL_PASSWORD: ci_password_only
        run: python -m unittest backend.tests.test_mysql_integration -v
